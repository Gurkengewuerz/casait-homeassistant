rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >
      The bridge is a plain local TCP endpoint with no credentials of any kind,
      so there is nothing that can expire and nothing to re-enter. Host, port and
      timeout changes are handled by the reconfigure flow.
  test-coverage:
    status: todo
    comment: >
      Overall coverage is around 55%, against the 95% the rule asks for. The API,
      helpers, edge tracker and const modules are well covered; the gap is the
      entity platforms and the 1-Wire chip drivers (ds28e17, oneWireBus, ds2438,
      ds2413), which need a fake bus to exercise at all.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: done
    comment: >
      The bus client in services/smbus_proxy.py speaks to the bridge over asyncio
      streams and every driver is a coroutine, so no bus I/O goes through the
      executor. The only external requirement, crccheck, does no I/O at all.
  inject-websession:
    status: exempt
    comment: >
      The integration speaks a binary protocol over a raw TCP socket and never
      makes an HTTP request, so there is no aiohttp or httpx session to inject.
  strict-typing: todo
