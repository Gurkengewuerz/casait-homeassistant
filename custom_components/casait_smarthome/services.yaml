scan_devices:
  name: Scan devices
  description: Scans the I2C and 1-Wire buses for supported casaIT devices.

set_led_palette:
  name: Set LED palette
  description: Writes one to five colors used by the LED controller animations.
  fields:
    device_id:
      name: LED controller
      description: The LED controller device. Its 1-Wire ROM ID is accepted as well.
      required: true
      selector:
        device:
          integration: casait_smarthome
    color_1:
      name: Color 1
      description: Primary color used by every animation.
      required: true
      selector:
        color_rgb:
    color_2:
      name: Color 2
      description: Secondary color used by alternate and chase animations.
      selector:
        color_rgb:
    color_3:
      name: Color 3
      description: Third chase color.
      selector:
        color_rgb:
    color_4:
      name: Color 4
      description: Fourth chase color.
      selector:
        color_rgb:
    color_5:
      name: Color 5
      description: Fifth chase color.
      selector:
        color_rgb:

calibrate_co2:
  name: Calibrate CO2 sensor
  description: >-
    Recalibrates the CO2 sensor of a Multisensor to a known concentration. Run it
    after the sensor has measured for at least three minutes in air of that
    concentration, for example fresh outdoor air at about 420 ppm.
  fields:
    device_id:
      name: Multisensor
      description: The Multisensor device whose CO2 sensor is calibrated.
      required: true
      selector:
        device:
          integration: casait_smarthome
    target_ppm:
      name: Reference concentration
      description: >-
        CO2 concentration the sensor is exposed to. Defaults to the value of the
        device's calibration target entity.
      example: 420
      selector:
        number:
          min: 300
          max: 5000
          unit_of_measurement: ppm
          mode: box
